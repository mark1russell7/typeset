# The bench of typeset (docs/BENCH.md). Each round starts one fresh process for each arm, and the order
# of the arms turns each round. The A/A pair gives the noise floor. The raw records are the artifact bench-records.
# The bench has no limit yet: a limit comes from 5 runs or more of workflow_dispatch (the rule limit-from-runs).
name: Bench

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/corpus/src/**"
      - "packages/bench/src/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      rounds:
        description: The count of rounds. Each round starts one fresh process for each arm.
        type: string
        default: "20"
      prediction:
        description: The id of the prediction that the run scores. A commit adds the prediction before the run.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          paths: |
            packages/corpus/src/**
            packages/bench/src/**
            .github/workflows/bench.yml

  bench:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROUNDS: ${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '6' }}
      PREDICTION: ${{ inputs.prediction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the bench
        # main.ts also writes the table of the arms to the summary of the job
        run: pnpm bench --rounds "$ROUNDS" --out "$GITHUB_WORKSPACE/bench-records.json" --label "$PREDICTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-records
          path: bench-records.json
          if-no-files-found: error

  bench-ok:
    name: Bench OK
    if: always()
    needs: [changes, bench]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          needs: ${{ toJSON(needs) }}
