# The bench of typeset (docs/BENCH.md). Each round starts one fresh process for each arm, and the order
# of the arms turns each round. The A/A pair gives the noise floor. The raw records are the artifact bench-records.
# The bench has no limit yet: a limit comes from 5 runs or more of workflow_dispatch (the rule limit-from-runs).
# The job weight has a limit: its bytes do not depend on the runner, so one measure gives it (docs/BENCH.md).
name: Bench

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/corpus/src/**"
      - "packages/typeset/src/**"
      - "packages/widths/src/**"
      - "packages/bench/src/**"
      - "packages/bench/weight.json"
      - "packages/typeset/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      rounds:
        description: The count of rounds. Each round starts one fresh process for each arm. Empty gives 2 times the count of arms, a balanced order.
        type: string
        default: ""
      prediction:
        description: The id of the prediction that the run scores. A commit adds the prediction before the run.
        type: string
        default: ""
      runs:
        description: The count of bench jobs, each on its own runner. A limit needs 5 runs or more.
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
      weight: ${{ steps.weight.outputs.match }}
      runs: ${{ steps.runs.outputs.list }}
    env:
      RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '1' }}
    steps:
      # The matrix of the bench jobs: [1, ..., RUNS]
      - id: runs
        run: echo "list=[$(seq -s, 1 "$RUNS")]" >> "$GITHUB_OUTPUT"
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@93668034510218d1ab35f1071d943f96d3fa7c38 # main
        with:
          paths: |
            packages/corpus/src/**
            packages/typeset/src/**
            packages/widths/src/**
            packages/bench/src/**
            .github/workflows/bench.yml
      - id: weight
        uses: mark1russell7/template/.github/actions/changes@93668034510218d1ab35f1071d943f96d3fa7c38 # main
        with:
          paths: |
            packages/typeset/src/**
            packages/typeset/package.json
            packages/bench/src/weight*
            packages/bench/weight.json
            pnpm-lock.yaml
            .github/workflows/bench.yml

  bench:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(needs.changes.outputs.runs) }}
    env:
      ROUNDS: ${{ github.event_name == 'workflow_dispatch' && inputs.rounds || '' }}
      PREDICTION: ${{ inputs.prediction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A fixture of the measurer cases, not a part of the harness: the pinned fonts, with the SHA-256 of each file
      - name: Fetch the pinned fonts
        run: node packages/widths/src/fetch.ts "$RUNNER_TEMP/fonts"
      - name: Run the bench
        # main.ts also writes the table of the arms to the summary of the job
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
        run: pnpm bench ${ROUNDS:+--rounds "$ROUNDS"} --out "$GITHUB_WORKSPACE/bench-records.json" --label "$PREDICTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-records-${{ matrix.run }}
          path: bench-records.json
          if-no-files-found: error

  # The bytes that a user pays for each public entry, against the newest release tag
  weight:
    needs: changes
    if: needs.changes.outputs.weight == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEIGHT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the weight of each entry with the last release
        run: pnpm weight --out "$GITHUB_WORKSPACE/weight-record.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: weight-record
          path: weight-record.json
          if-no-files-found: error

  bench-ok:
    name: Bench OK
    if: ${{ !cancelled() }}
    needs: [changes, bench, weight]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@93668034510218d1ab35f1071d943f96d3fa7c38 # main
        with:
          needs: ${{ toJSON(needs) }}
          # The job weight skips only when its filter finds no weighed file. Then no entry changed, so the skip is no read of a change.
          allow-skip: weight
