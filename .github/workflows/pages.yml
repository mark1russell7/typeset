# Builds packages/site and publishes it to GitHub Pages at https://mark1russell7.github.io/typeset/, with
# the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # One build each day, so the Status page shows the open pull requests and the data date of the day
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push waits until the current deployment ends, so each push to main gets a result.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@214dbed7b52dac94c0dce1c170162e75672a556d # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      build: pnpm --filter @typeset/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}"}'
      # The Releases page and the Status page (releases/, status/ and their data/*.json), at deploy time
      roadmap: docs/ROADMAP.md
      site-name: typeset
