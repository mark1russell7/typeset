name: Site read

# The read of the section "Justified lines" on the served site (T14). Chromium opens the site. For en-us, de and fr, the
# read takes the lines of the sample text, then of a visitor text at 200 px. It checks each line, its ratio, the worst ratio
# and the hyphen count of total fit and greedy, and the table of the language sets. The record is an artifact.
# The read starts after each Pages run on main, on a pull request that changes the read, or by hand with a URL.

on:
  pull_request:
  workflow_run:
    workflows: [Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: The URL of the site.
        type: string
        default: https://mark1russell7.github.io/typeset/

permissions:
  contents: read

concurrency:
  group: site-read-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs the read when the read or the lock changes. Each other event is a match.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e40f24f720842bed9720c849da482f04dc8978ad # main
        with:
          paths: |
            packages/widths/src/justify-read-main.ts
            packages/widths/package.json
            pnpm-lock.yaml
            .github/workflows/site-read.yml

  read:
    name: Justified lines
    needs: changes
    # After a Pages run, the read starts only when the deployment passed.
    if: needs.changes.outputs.match == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ inputs.url || 'https://mark1russell7.github.io/typeset/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @typeset/widths...
      - name: Install the browser
        run: pnpm --filter @typeset/widths exec playwright install --with-deps chromium
      - name: Read the section
        run: node packages/widths/src/justify-read-main.ts --url "$SITE_URL" --out "$GITHUB_WORKSPACE/justify-read.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: justify-read
          path: justify-read.json
          if-no-files-found: error

  site-read-ok:
    name: Site read OK
    if: ${{ !cancelled() }}
    needs: [changes, read]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e40f24f720842bed9720c849da482f04dc8978ad # main
        with:
          needs: ${{ toJSON(needs) }}
