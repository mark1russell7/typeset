name: Fonts

# The widths of the font tables against canvas measureText in headless Chromium, on the corpus.
# The job downloads the pinned Noto fonts, makes a WOFF2 file of each with fontTools, and uploads font-widths.json.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      per-cell:
        description: The count of samples for each script and each length class.
        type: string
        default: "40"
      prediction:
        description: The id of the prediction that the run scores. A commit adds the prediction before the run.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fonts-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          paths: |
            packages/corpus/src/**
            packages/fonts/src/**
            packages/widths/src/**
            .github/workflows/fonts.yml

  widths:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PER_CELL: ${{ github.event_name == 'workflow_dispatch' && inputs.per-cell || '40' }}
      PREDICTION: ${{ inputs.prediction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the fonts
        run: node packages/widths/src/fetch.ts "$RUNNER_TEMP/fonts"
      - name: Make the WOFF2 files
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "fonttools==4.68.0" "brotli==1.2.1"
          mkdir -p "$RUNNER_TEMP/woff2"
          for file in "$RUNNER_TEMP"/fonts/*.ttf; do
            name="$(basename "$file" .ttf)"
            "$RUNNER_TEMP/venv/bin/python" -m fontTools.ttLib.woff2 compress -o "$RUNNER_TEMP/woff2/$name.woff2" "$file"
          done
      - name: Install Chromium
        run: pnpm --filter @typeset/widths exec playwright install --with-deps chromium
      - name: Measure the widths
        run: >-
          node packages/widths/src/main.ts --fonts "$RUNNER_TEMP/fonts" --woff2 "$RUNNER_TEMP/woff2"
          --per-cell "$PER_CELL" --out "$GITHUB_WORKSPACE/font-widths.json" --label "$PREDICTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-widths
          path: font-widths.json
          if-no-files-found: error

  fonts-ok:
    name: Fonts OK
    if: always()
    needs: [changes, widths]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          needs: ${{ toJSON(needs) }}
