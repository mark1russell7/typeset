name: Fonts

# The widths of the font tables against canvas measureText in headless Chromium, on the corpus, on four arms:
# Linux at the device scale 1 and 2, macOS at the scale 2 and Windows at the scale 1. Each arm downloads the pinned
# fonts and uploads font-widths-<arm>. The arm linux-1 also checks the WOFF2 files and uploads harfbuzz-bounds (T4).
# The report job scores the outcomes. A pull request runs the arms when a font input changes, or when the lock changes
# the version of playwright, which fixes the browser. The weekly run catches a change with no commit, such as a new runner image.

on:
  pull_request:
  schedule:
    - cron: "48 7 * * 1"
  workflow_dispatch:
    inputs:
      per-cell:
        description: The count of samples for each script and each length class.
        type: string
        default: "40"
      prediction:
        description: The id of the prediction that the run scores. A commit adds the prediction before the run.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fonts-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match == 'true' || steps.browser.outputs.changed == 'true' }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e5528b40a615db0f2e0f341c5ec0fa860ca47cc0 # main
        with:
          paths: |
            packages/corpus/src/**
            packages/widths/src/**
            packages/typeset/src/**
            .github/workflows/fonts.yml
      # The paths above do not see a bump of playwright, which changes only the lock. This step compares that one entry.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: browser
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:pnpm-lock.yaml" > "$RUNNER_TEMP/base-lock.yaml"
          node packages/widths/scripts/browser-lock.ts "$RUNNER_TEMP/base-lock.yaml" pnpm-lock.yaml

  widths:
    name: Widths (${{ matrix.arm }})
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # linux-1 rounds each advance to whole px, so it is the reference of the mode pixel. It also checks WOFF2.
          # Each arm names its text engine. The table engines of @mark1russell7/typeset/fonts gives the rules of each engine.
          - { arm: linux-1, os: ubuntu-latest, scale: "1", reference: pixel, woff2: true, engine: freetype }
          - { arm: linux-2, os: ubuntu-latest, scale: "2", reference: exact, woff2: false, engine: freetype }
          - { arm: macos-2, os: macos-latest, scale: "2", reference: exact, woff2: false, engine: coretext }
          - { arm: windows-1, os: windows-latest, scale: "1", reference: exact, woff2: false, engine: directwrite }
    defaults:
      run:
        shell: bash
    env:
      PER_CELL: ${{ github.event_name == 'workflow_dispatch' && inputs.per-cell || '40' }}
      PREDICTION: ${{ inputs.prediction }}
      ARM: ${{ matrix.arm }}
      SCALE: ${{ matrix.scale }}
      REFERENCE: ${{ matrix.reference }}
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the fonts
        run: node packages/widths/src/fetch.ts "$RUNNER_TEMP/fonts"
      # The tests of the Indic shaper and of the Text rope need the real fonts. Without TYPESET_FONTS, they do not run.
      - name: Test the shapers with the real fonts
        run: pnpm --filter @mark1russell7/typeset exec vitest run src/fonts/indic.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
      - name: Test the Text rope with the real fonts
        run: pnpm --filter @typeset/widths exec vitest run src/text.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
      - name: Test the measurer with the real fonts
        run: pnpm --filter @typeset/widths exec vitest run src/measurer.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
      - name: Test the hidden code points, the risks and the fallback with the real fonts
        run: pnpm --filter @mark1russell7/typeset exec vitest run src/fonts/hidden.test.ts src/fonts/risks.test.ts src/measurer/fallback.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
      # T6: the model against HarfBuzz on the sequence list, and the 3 fonts outside the model
      - name: Measure the sequence list against HarfBuzz
        if: matrix.arm == 'linux-1'
        run: pnpm --filter @typeset/widths exec vitest run src/sequences.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
          TYPESET_SEQUENCES_OUT: ${{ github.workspace }}/sequence-bounds.json
      - if: matrix.arm == 'linux-1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequence-bounds
          path: sequence-bounds.json
          if-no-files-found: error
      # T4: the error of the fast path against HarfBuzz. HarfBuzz and the model run in Node, so one arm is sufficient.
      - name: Measure the error bounds against HarfBuzz
        if: matrix.arm == 'linux-1'
        run: pnpm --filter @typeset/widths exec vitest run src/bounds.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
          TYPESET_BOUNDS_OUT: ${{ github.workspace }}/harfbuzz-bounds.json
      - if: matrix.arm == 'linux-1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harfbuzz-bounds
          path: harfbuzz-bounds.json
          if-no-files-found: error
      - name: Test the width limit with the real fonts
        run: pnpm --filter @typeset/widths exec vitest run src/bound.test.ts
        env:
          TYPESET_FONTS: ${{ runner.temp }}/fonts
          TYPESET_BOUND_RECORD: ${{ runner.temp }}/width-bound/width-bound-${{ matrix.arm }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: width-bound-${{ matrix.arm }}
          path: ${{ runner.temp }}/width-bound
      - name: Make the WOFF2 files
        if: matrix.woff2
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "fonttools==4.68.0" "brotli==1.2.1"
          mkdir -p "$RUNNER_TEMP/woff2"
          for file in "$RUNNER_TEMP"/fonts/*.ttf; do
            name="$(basename "$file" .ttf)"
            "$RUNNER_TEMP/venv/bin/python" -m fontTools.ttLib.woff2 compress -o "$RUNNER_TEMP/woff2/$name.woff2" "$file"
          done
          echo "WOFF2=--woff2=$RUNNER_TEMP/woff2" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: pnpm --filter @typeset/widths exec playwright install --with-deps chromium
      - name: Measure the widths
        run: >-
          node packages/widths/src/main.ts --fonts "$RUNNER_TEMP/fonts" ${WOFF2:-}
          --arm "$ARM" --scale "$SCALE" --reference "$REFERENCE" --engine "$ENGINE"
          --per-cell "$PER_CELL" --out "$GITHUB_WORKSPACE/font-widths.json" --label "$PREDICTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-widths-${{ matrix.arm }}
          path: font-widths.json
          if-no-files-found: error

  # The outcomes of the prediction, from the files of all the arms. An arm that failed makes its outcomes fail, not this job.
  report:
    needs: [changes, widths]
    if: ${{ !cancelled() && needs.changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scorer writes its check lines with `@mark1russell7/rigor-bench`, so the job installs the packages.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @typeset/widths...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: font-widths-*
          path: arms
      - name: Score the outcomes
        run: node packages/widths/src/score.ts arms --out outcomes.json
      # The gate of the font stacks: each width cell at most 1.28/64 px, and each break cell a pass or a known gap with a dated item
      - name: Gate the font stacks
        run: node packages/widths/src/stack-gate.ts arms
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-outcomes
          path: outcomes.json
          if-no-files-found: error

  fonts-ok:
    name: Fonts OK
    if: ${{ !cancelled() }}
    needs: [changes, widths, report]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e5528b40a615db0f2e0f341c5ec0fa860ca47cc0 # main
        with:
          needs: ${{ toJSON(needs) }}
