name: Bidi order

# The visual order of mixed-direction texts in Chromium, Firefox and WebKit (T13b). Each browser lays out 600 seeded texts
# with Latin and Hebrew letters, both kinds of digits, paired brackets, marks of direction and explicit controls. The job
# reads the place of each character from a DOM range and compares the order with visualIndexes of ./bidi. Each browser
# uploads its record. The job "Join the records" joins them: a mismatch in Chromium fails it, a mismatch in the others is a warning.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: The seed of the texts.
        type: string
        default: "13"
      count:
        description: The count of texts.
        type: string
        default: "600"

permissions:
  contents: read

concurrency:
  group: bidi-order-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request runs the read when the bidi code, the read or the lock changes. Each other event is a match.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
        with:
          paths: |
            packages/typeset/src/bidi.ts
            packages/typeset/src/bidi/**
            packages/widths/src/bidi-order*.ts
            packages/widths/package.json
            pnpm-lock.yaml
            .github/workflows/bidi-order.yml

  order:
    name: Order (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SEED: ${{ inputs.seed || '13' }}
      COUNT: ${{ inputs.count || '600' }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @typeset/widths...
      - name: Install the browser
        run: pnpm --filter @typeset/widths exec playwright install --with-deps "$BROWSER"
      - name: Read the order
        run: node packages/widths/src/bidi-order-main.ts --browser "$BROWSER" --seed "$SEED" --count "$COUNT" --out "$GITHUB_WORKSPACE/bidi-order.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bidi-order-${{ matrix.browser }}
          path: bidi-order.json
          if-no-files-found: error

  merge:
    name: Join the records
    needs: [changes, order]
    if: ${{ !cancelled() && needs.changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @typeset/widths...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bidi-order-*
          path: ${{ runner.temp }}/records
      - name: Join the records
        run: node packages/widths/src/bidi-order-merge.ts --records "$RUNNER_TEMP/records" --out "$GITHUB_WORKSPACE/bidi-order.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bidi-order
          path: bidi-order.json
          if-no-files-found: error

  bidi-order-ok:
    name: Bidi order OK
    if: always()
    needs: [changes, order, merge]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
        with:
          needs: ${{ toJSON(needs) }}
